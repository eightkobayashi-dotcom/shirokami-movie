<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <title>「白紙の向こう側」｜映画上映</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="opening">
    <h1>白紙の向こう側</h1>
</div>
    <nav class="menu">
        <a href="story.html">STORY</a>
        <a href="#info">INFO</a>
        <a href="#reserve">RESERVE</a>
    </nav>

<div class="container">
    <h1 class="title fade-item">「白紙の向こう側」</h1>

    <p class="catchcopy fade-item">
        「紙に書く」という行為は、未来に何を遺すのか─。
    </p>
    <div class="story fade-item" id="story">
        <p>
            忘れられた言葉と、残された想い。<br>
            一枚の紙に込められた記憶が、未来へつながる物語。
        </p>
    </div>
</div>

<div class="gallery fade-in">
    <img src="images/poster.jpg" alt="映画ポスター">
</div>

<div class="container">
    <div class="countdown">
        <p class="countdown-title">上映まであと</p>

        <div class="timer-box">
            <p id="timer">計算中...</p>
        </div>
    </div>
    <div class="info" id="info">
    <div class="info-box">
        <h2>上映日時</h2>
        <p>9/5(土)<br>11:25〜11:45</p>
    </div>

    <div class="info-box">
        <h2>上映場所</h2>
        <p>体育館</p>
    </div>
    <div id="reserve">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdyabLPAphyDqj_KKCKdhzAS1zDxVyMf5P0okwtWepVIZuEYg/viewform?usp=publish-editor">
        <button class="reserve-button" id="main-reserve-button">
            予約する
        </button>
    </a>
    </div>
</div>
<div class="mobile-reserve">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdyabLPAphyDqj_KKCKdhzAS1zDxVyMf5P0okwtWepVIZuEYg/viewform?usp=publish-editor">
        予約する
    </a>
</div>

<script>
const image = document.querySelector(".gallery img");

function showImage() {
    const imageTop = image.getBoundingClientRect().top;

    if (imageTop < window.innerHeight * 0.9) {
        image.classList.add("show");
    }
}

window.addEventListener("scroll", showImage);
window.addEventListener("load", showImage);
</script>

<script>
const target = new Date("2026/9/5 11:25:00");

function countdown() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
        document.getElementById("timer").textContent = "上映時間です";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);

    document.getElementById("timer").textContent =
        `${days}日 ${hours}時間 ${minutes}分`;
}

countdown();
setInterval(countdown, 60000);
</script>
<script>
const reserveButton = document.getElementById("main-reserve-button");
const mobileReserve = document.querySelector(".mobile-reserve");

function checkReserveButton() {
    const rect = reserveButton.getBoundingClientRect();

    if (rect.bottom< window.innerHeight) {
        mobileReserve.style.display = "none";
    } else {
        mobileReserve.style.display = "block";
    }
}

window.addEventListener("scroll", checkReserveButton);
window.addEventListener("load", checkReserveButton);
</script>
</body>
</html>
